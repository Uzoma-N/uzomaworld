<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uzoma Nwiwu</title>

    <!--
    - favicon
  -->
    <link
      rel="shortcut icon"
      href="{{ url_for('static', filename='assets/title_icon.png') }}"
      type="image/x-icon"
    />

    <!--
    - custom css link
  -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />

    <!--
    - google font link
  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!--
    - #MAIN
  -->

    <main>
      <!--
      - #SIDEBAR
    -->

      <aside class="sidebar" data-sidebar>
        <div class="sidebar-info">
          <div id="image-data"></div>

          <div class="info-content" id="nameRole-data"></div>

          <button class="info_more-btn" data-sidebar-btn>
            <span>Show Contacts</span>

            <ion-icon name="chevron-down"></ion-icon>
          </button>
        </div>

        <div class="sidebar-info_more">
          <div class="separator"></div>

          <ul class="contacts-list" id="detail-data"></ul>

          <div class="separator"></div>

          <ul id="socials-list" class="social-list"></ul>          
        </div>
        <div class="filter-section">
            <div class="separator"></div>
            <div class="added-content"> 
              <div class="change-profile">  
                <p class="profile-text"> Select profile to view:</p>            
                <div class="filters">
                
                  <select id="profile-select"></select>

                  <button id="change-profile-btn" class="primary-btn">
                  Select
                </button>
                </div>              
              </div>
              
              <div class="change-profile">
                
                <div class="filters">
                  <div class="filter-left">
                    <label for="cat-options-list" class="filter-label"
                      >CV Category:</label
                    >
                    <button id="apply-filter-btn" class="primary-btn">Filter</button>
                  </div>
                  <div id="cat-options-list" class="checkbox-options-list"></div>
                </div>                
              </div>
            </div>
          </div>
      </aside>

      <!--
      - #main-content
    -->

      <div class="main-content">
        <!--
        - #NAVBAR
      -->

        <nav class="navbar">
          <ul class="navbar-list">
            <li class="navbar-item">
              <button class="navbar-link active" data-nav-link>About</button>
            </li>

            <li class="navbar-item">
              <button class="navbar-link" data-nav-link>Resume</button>
            </li>

            <li class="navbar-item">
              <button class="navbar-link" data-nav-link>Skill</button>
            </li>

            <li class="navbar-item">
              <button class="navbar-link" data-nav-link>Portfolio</button>
            </li>

            <li class="navbar-item">
              <button class="navbar-link" data-nav-link>Contact</button>
            </li>
          </ul>
        </nav>

        <!--
        - #ABOUT
      -->

        <article class="about active" data-page="about">
          <header>
            <h2 class="h2 article-title">About me</h2>
          </header>

          <section class="about-text" id="about-data"></section>

          <!--
          - service
            -->

          <section class="service">
            <h3 class="h3 service-title">What i'm doing</h3>

            <ul id="services-list" class="service-list"></ul>
          </section>
        </article>

        <!--
        - #RESUME
      -->

        <article class="resume" data-page="resume">
          <header>
            <h2 class="h2 article-title">Resume</h2>
          </header>

          <section class="timeline">
            <div class="title-wrapper">
              <div class="icon-box">
                <ion-icon name="book-outline"></ion-icon>
              </div>

              <h3 class="h3">Education</h3>
            </div>

            <ol id="education-list" class="timeline-list"></ol>
          </section>

          <section class="timeline">
            <div class="title-wrapper">
              <div class="icon-box">
                <ion-icon name="book-outline"></ion-icon>
              </div>

              <h3 class="h3">Experience</h3>
            </div>

            <ol id="experience-list" class="timeline-list"></ol>
          </section>
        </article>

        <!--
        - #TRAINING
      -->

        <article class="resume" data-page="skill">
          <header>
            <h2 class="h2 article-title">Skill</h2>
          </header>
          <section class="skill">
            <div id="skill-list"></div>
          </section>

          <section class="timeline">
            <div class="title-wrapper">
              <h3 class="h3">Certification</h3>
            </div>

            <ol id="certification-list" class="timeline-list-2"></ol>
          </section>
        </article>

        <!--
        - #PORTFOLIO
      -->
        <article class="portfolio" data-page="portfolio">
          <header>
            <h2 class="h2 article-title">Portfolio</h2>
          </header>

          <section class="projects">
            <ul id="project-filter-list" class="filter-list"></ul>

            <div class="filter-select-box">
              <button class="filter-select" data-select>
                <div class="select-value" data-selecct-value>
                  Select category
                </div>

                <div class="select-icon">
                  <ion-icon name="chevron-down"></ion-icon>
                </div>
              </button>

              <ul id="project-select-list" class="select-list"></ul>
            </div>

            <ul id="projects-list" class="project-list"></ul>
          </section>
        </article>
        <!--
        - #CONTACT
      -->

        <article class="contact" data-page="contact">
          <header>
            <h2 class="h2 article-title">Contact</h2>
          </header>

          <section class="mapbox" data-mapbox>
            <figure>
              <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d24317.92673357494!2d8.7555866!3d51.7189204!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47b9a4e3e6b4e1e3%3A0x420e3f4e3a3e3e3e!2sPaderborn%2C%20Germany!5e0!3m2!1sen!2sde!4v1700000000000!5m2!1sen!2sde"
                width="400"
                height="300"
                loading="lazy"
              ></iframe>
            </figure>
          </section>

          <section class="contact-form">
            <h3 class="h3 form-title">Contact Form</h3>

            <form action="https://formspree.io/f/xqawqjzy" method="post" class="form" id="contactForm" data-form>
              <div class="input-wrapper">
                <input
                  type="text"
                  name="fullname"
                  class="form-input"
                  placeholder="Full name"
                  required
                  data-form-input
                />

                <input
                  type="email"
                  name="email"
                  class="form-input"
                  placeholder="Email address"
                  required
                  data-form-input
                />
              </div>

              <textarea
                name="message"
                class="form-input"
                placeholder="Your Message"
                required
                data-form-input
              ></textarea>

              <button class="form-btn" type="submit" disabled data-form-btn>
                <ion-icon name="paper-plane"></ion-icon>
                <span>Send Message</span>
              </button>
            </form>

            <!-- Message box to display submission status (success/error) -->
            <div id="form-status" class="mt-4 p-3 rounded-lg text-sm hidden transition-all duration-300"></div>
          </section>
        </article>
      </div>
    </main>

    <script id="all-data-container" type="application/json">

      {{ json_data | tojson }}
    </script>

    <!--
    - ionicon link
  -->
    <script 
      type="module"
      src="{{ url_for('static', filename='script.js') }}">
    </script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
